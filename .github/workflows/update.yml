name: 每日更新先行指標

on:
  schedule:
    # UTC 06:07 = 台灣時間 14:07，週一到週五（休市日由程式自行判斷並略過）
    - cron: '7 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '休市日也強制執行（測試用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-history-csv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝需要的套件
        run: pip install requests pandas lxml beautifulsoup4

      - name: 執行抓取與計算（休市日會自動略過）
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python taiex_indicators.py

      - name: 把新資料寫回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.csv
          if git diff --cached --quiet; then
            echo "沒有新資料需要提交"
            exit 0
          fi
          git commit -m "自動更新 $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "推送失敗，準備第 $((i + 1)) 次嘗試..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "多次重試後仍然推送失敗"
          exit 1
