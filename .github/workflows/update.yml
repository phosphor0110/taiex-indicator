name: 每日更新先行指標

on:
  schedule:
    # UTC 06:07 = 台灣時間 14:07，週一到週五（休市日由程式自行判斷並略過）
    - cron: '7 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '休市日也強制執行（測試用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-history-csv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得倉庫程式碼
        uses: actions/checkout@v4
        with:
          # 一律取最新的 main。不指定的話，在 Actions 頁面按「Re-run」時會用
          # 當初那次執行的舊版本，history.csv 看不到後來已寫入的資料，推送時就會衝突。
          ref: main

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝需要的套件
        run: pip install requests pandas lxml beautifulsoup4

      - name: 執行抓取與計算（休市日會自動略過）
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python taiex_indicators.py

      - name: 把新資料寫回倉庫
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add history.csv
            if git diff --cached --quiet; then
              echo "沒有新資料需要提交"
              exit 0
            fi
            git commit -q -m "自動更新 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            if git push origin HEAD:main; then
              exit 0
            fi
            # main 在這段期間有了新的提交（例如另一次執行也寫入了今天的資料）。
            # 不用 git pull --rebase 硬合併 CSV（同一列兩邊都改會衝突），而是改以
            # 最新的 main 為基準重新執行一次：程式只會補上還空白的欄位。
            echo "推送失敗，改以最新 main 為基準重新抓取，準備第 $((i + 1)) 次嘗試..."
            sleep $((RANDOM % 10 + 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            python taiex_indicators.py || true
          done
          echo "多次重試後仍然推送失敗"
          exit 1
